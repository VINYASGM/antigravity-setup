name: CodeRabbit & PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-quality-gate:
    name: Validate CodeRabbit Config & Quality Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate CodeRabbit Configuration (.coderabbit.yaml)
        run: |
          node -e "
            const fs = require('fs');
            if (!fs.existsSync('.coderabbit.yaml')) {
              console.error('Error: .coderabbit.yaml configuration file not found.');
              process.exit(1);
            }
            console.log('✓ .coderabbit.yaml successfully detected.');
          "

      - name: Run Quality Gate Test Suite
        run: node tests/test-hooks.js
